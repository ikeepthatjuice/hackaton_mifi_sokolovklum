name: Emulator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Without KVM the x86_64 emulator falls back to software and is too slow to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Weights for instrumented tests only; skipped until models/manifest.json and the fetch script are in main.
      - name: Cache model weights
        id: models-cache
        if: hashFiles('models/manifest.json') != '' && hashFiles('scripts/fetch-models.sh') != ''
        uses: actions/cache@v4
        with:
          path: local_models/
          key: models-${{ hashFiles('models/manifest.json') }}

      - name: Fetch model weights
        if: hashFiles('models/manifest.json') != '' && hashFiles('scripts/fetch-models.sh') != '' && steps.models-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch-models.sh local_models

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      # First run boots once and saves a snapshot; later runs start from it.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Install, start, instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ndk: 26.1.10909125
          cmake: 3.22.1
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: src/android
          script: bash ../../scripts/emulator-smoke.sh

      - name: Upload emulator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report-${{ github.sha }}
          path: |
            emulator-logcat.txt
            src/android/**/build/reports/androidTests/
          retention-days: 3
          if-no-files-found: ignore
